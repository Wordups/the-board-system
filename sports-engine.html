<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <meta name="description" content="Sports Engine — NFL parlay generation system.">
  <title>Sports Engine · The Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/board.css">
  <style>
    .engine-container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 2rem;
    }

    .parlays-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .parlay-card { display: contents; }
    .tickets { display: contents; }

    .ticket {
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, .42);
      border-radius: 18px;
      background: linear-gradient(180deg, #0765c8 0, #054e9b 100%);
      box-shadow: 0 18px 48px rgba(0, 33, 80, .28);
    }

    .ticket-topbar {
      min-height: 82px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #fff;
    }

    .ticket-heading { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .sgp-badge {
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 6px;
      padding: 5px 8px 4px;
      color: #ffe142;
      font: 800 .72rem/1 Manrope, sans-serif;
      letter-spacing: .08em;
      transform: skew(-7deg);
    }
    .ticket-title { font-size: clamp(1.1rem, 3vw, 1.45rem); font-weight: 800; white-space: nowrap; }
    .ticket-odds { font-size: clamp(1.35rem, 3.5vw, 1.8rem); font-weight: 800; white-space: nowrap; }

    .ticket-body {
      margin: 0 14px 14px;
      padding: 24px 24px 28px;
      border-radius: 16px;
      background: #17191c;
      color: #f5f7fa;
    }

    .ticket-meta { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; }
    .game-matchup { font-size: clamp(1rem, 2.5vw, 1.28rem); font-weight: 600; }
    .game-time { color: #aeb5c0; white-space: nowrap; font-size: .92rem; }
    .ticket-context { margin: 8px 0 22px; color: #87909c; font: 500 .7rem/1.3 DM Mono, monospace; letter-spacing: .08em; text-transform: uppercase; }

    .legs-list { position: relative; }
    .leg {
      position: relative;
      min-height: 86px;
      padding: 8px 0 12px 86px;
      display: flex;
      align-items: center;
    }
    .leg:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 22px;
      top: 52px;
      bottom: -34px;
      width: 2px;
      background: #68707b;
    }
    .leg-node {
      position: absolute;
      left: 0;
      top: 22px;
      width: 46px;
      height: 46px;
      border: 2px solid #737b86;
      border-radius: 50%;
      background: #202328;
      z-index: 1;
    }
    .leg-ball {
      position: absolute;
      left: 48px;
      top: 20px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #292d33;
      color: #0b75d1;
      font-size: 1.1rem;
      z-index: 2;
    }
    .leg-copy { min-width: 0; padding-left: 18px; }
    .leg-selection {
      color: #0877da;
      font-size: clamp(1rem, 3vw, 1.32rem);
      font-weight: 800;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }
    .leg-market {
      margin-top: 5px;
      color: #a9afb8;
      font: 500 clamp(.67rem, 2vw, .82rem)/1.3 DM Mono, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .ticket-footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #30343a;
      color: #aab1bb;
      font-size: .78rem;
    }
    .ticket-footer strong { color: #fff; }

    .td-parlays-section {
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 2px solid #3b82f6;
    }

    .td-section-title {
      text-align: center;
      color: #3b82f6;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }

    .td-parlay-card {
      background: #1e293b;
      border: 2px solid #ef4444;
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .td-game-header {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      padding: 1.5rem;
    }

    .td-game-matchup {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .td-legs {
      padding: 1.5rem;
    }

    .td-leg {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border-radius: 0.25rem;
    }

    .td-leg-player {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fca5a5;
      margin-bottom: 0.25rem;
    }

    .td-leg-odds {
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .parlays-grid {
        grid-template-columns: 1fr;
      }

      .engine-container { padding: 1rem; }
      .ticket-topbar { min-height: 70px; padding: 0 16px; }
      .ticket-body { margin: 0 8px 8px; padding: 20px 14px 24px; }
      .ticket-meta { align-items: flex-start; }
      .leg { padding-left: 72px; min-height: 82px; }
      .leg-ball { left: 42px; width: 36px; height: 36px; }
      .leg-copy { padding-left: 12px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#app">Skip to the engine</a>

  <nav class="site-switch" aria-label="Board network">
    <span class="site-switch-label">The Board Network</span>
    <a class="site-tab" href="https://wordups.github.io/the-board-system/">Sports Board</a>
    <a class="site-tab active" href="sports-engine.html" aria-current="page">Sports Engine</a>
    <a class="site-tab" href="https://wordups.github.io/the-board-market/">Stock Market</a>
  </nav>

  <header class="site-header">
    <a class="brand" href="sports-engine.html" aria-label="Sports Engine home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>SPORTS ENGINE</strong><small>PARLAY SYSTEM</small></span>
    </a>
    <div class="header-status">
      <span class="status-pulse" aria-hidden="true"></span>
      <span id="header-freshness" style="display: none;">Loading slate</span>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="engine-container">
      <div class="parlays-grid" id="parlays-container">
        <section class="loading-state" aria-live="polite">
          <div class="loading-orbit" aria-hidden="true"></div>
          <p>Loading parlay data…</p>
        </section>
      </div>

      <div class="td-parlays-section" id="td-section" style="display:none;">
        <h2 class="td-section-title">⭐ Star Player TD Parlays</h2>
        <div id="td-parlays-container">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <noscript>Sports Engine needs JavaScript to display parlay data.</noscript>
  <script src="assets/board.js"></script>
  <script>
    async function loadParlays() {
      try {
        const response = await fetch('data/nfl_parlays.json');
        const data = await response.json();

        const container = document.getElementById('parlays-container');
        container.innerHTML = '';

        data.parlays.forEach((parlay, index) => {
          const card = createParlayCard(parlay, index);
          container.appendChild(card);
        });

        renderTDParlays(data);
      } catch (error) {
        console.error('Error loading parlays:', error);
        document.getElementById('parlays-container').innerHTML =
          '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">Error loading parlay data</p>';
      }
    }

    const teamNames = {
      ARI: 'Arizona Cardinals', ATL: 'Atlanta Falcons', BAL: 'Baltimore Ravens', BUF: 'Buffalo Bills',
      CAR: 'Carolina Panthers', CHI: 'Chicago Bears', CIN: 'Cincinnati Bengals', CLE: 'Cleveland Browns',
      DAL: 'Dallas Cowboys', DEN: 'Denver Broncos', DET: 'Detroit Lions', GB: 'Green Bay Packers',
      HOU: 'Houston Texans', IND: 'Indianapolis Colts', JAX: 'Jacksonville Jaguars', KC: 'Kansas City Chiefs',
      LV: 'Las Vegas Raiders', LAC: 'Los Angeles Chargers', LAR: 'Los Angeles Rams', MIA: 'Miami Dolphins',
      MIN: 'Minnesota Vikings', NE: 'New England Patriots', NO: 'New Orleans Saints', NYG: 'New York Giants',
      NYJ: 'New York Jets', PHI: 'Philadelphia Eagles', PIT: 'Pittsburgh Steelers', SEA: 'Seattle Seahawks',
      SF: 'San Francisco 49ers', TB: 'Tampa Bay Buccaneers', TEN: 'Tennessee Titans', WAS: 'Washington Commanders'
    };

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[char]);
    }

    function fullMatchup(matchup) {
      const [away, home] = matchup.split(/\s*@\s*/);
      return `${teamNames[away] || away} @ ${teamNames[home] || home}`;
    }

    function americanOdds(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? `+${number}` : String(value);
    }

    function legDisplay(leg) {
      const player = escapeHTML(leg.player_name);
      const line = Number(leg.line);
      const nextWhole = Number.isInteger(line) ? line : Math.floor(line) + 1;
      const formats = {
        PassYds: [`${player} ${nextWhole}+ Yards`, `${player} - Alt Passing Yds`],
        RushYds: [`${player} ${nextWhole}+ Yards`, `${player} - Alt Rushing Yds`],
        RecYds: [`${player} ${nextWhole}+ Yards`, `${player} - Alt Receiving Yds`],
        REC: [`${player} ${nextWhole}+ Receptions`, `${player} - Alt Receptions`],
        PassTD: [`${player} ${nextWhole}+ Passing Touchdowns`, `${player} - Alt Passing TDs`],
        TD: [`${player}`, 'Any Time Touchdown Scorer']
      };
      const [selection, market] = formats[leg.market] || [`${player} ${escapeHTML(leg.line)}`, escapeHTML(leg.market)];
      return `
        <div class="leg">
          <span class="leg-node" aria-hidden="true"></span>
          <span class="leg-ball" aria-hidden="true">🏈</span>
          <div class="leg-copy">
            <div class="leg-selection">${selection}</div>
            <div class="leg-market">${market}</div>
          </div>
        </div>`;
    }

    function ticketHTML(parlay, ticket, type) {
      const tier = type === 'grind' ? 'Grind' : 'Moonshot';
      return `
        <article class="ticket ticket-${type}">
          <header class="ticket-topbar">
            <div class="ticket-heading">
              <span class="sgp-badge">SGP</span>
              <span class="ticket-title">Same Game Parlay</span>
            </div>
            <div class="ticket-odds">${americanOdds(ticket.odds)}</div>
          </header>
          <div class="ticket-body">
            <div class="ticket-meta">
              <div class="game-matchup">${escapeHTML(fullMatchup(parlay.matchup))}</div>
              <div class="game-time">${escapeHTML(parlay.time)}</div>
            </div>
            <div class="ticket-context">${tier} · ${ticket.legs.length} plays · ${escapeHTML(parlay.game_script || 'normal')} game script</div>
            <div class="legs-list">${ticket.legs.map(legDisplay).join('')}</div>
            <footer class="ticket-footer">
              <span>Stake <strong>$${escapeHTML(ticket.stake)}</strong></span>
              <span>Potential return <strong>$${escapeHTML(ticket.implied_win)}</strong></span>
            </footer>
          </div>
        </article>`;
    }

    function createParlayCard(parlay) {
      const card = document.createElement('div');
      card.className = 'parlay-card';
      card.innerHTML = `<div class="tickets">
        ${parlay.grind ? ticketHTML(parlay, parlay.grind, 'grind') : ''}
        ${parlay.moonshot ? ticketHTML(parlay, parlay.moonshot, 'moonshot') : ''}
      </div>`;

      return card;
    }

    function renderTDParlays(data) {
      if (!data.td_parlays || data.td_parlays.length === 0) return;

      const tdSection = document.getElementById('td-section');
      const tdContainer = document.getElementById('td-parlays-container');
      tdSection.style.display = 'block';
      tdContainer.innerHTML = '';

      data.td_parlays.forEach(parlay => {
        const card = document.createElement('div');
        card.className = 'td-parlay-card';

        const legsHtml = parlay.td_parlay.legs.map(leg => `
          <div class="td-leg">
            <div class="td-leg-player">${leg.player_name}</div>
            <div class="td-leg-odds">
              <span>${leg.market}</span>
              <span>${leg.line}</span>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="td-game-header">
            <div class="td-game-matchup">${parlay.matchup}</div>
            <div style="font-size: 0.9rem; opacity: 0.9;">${parlay.time} · ${parlay.game_script}</div>
          </div>
          <div class="td-legs">
            <div style="font-weight: bold; margin-bottom: 1rem; color: #fca5a5;">
              Odds: ${parlay.td_parlay.odds} · ${parlay.td_parlay.legs.length} Star Players
            </div>
            ${legsHtml}
          </div>
        `;

        tdContainer.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadParlays);
  </script>
</body>
</html>
