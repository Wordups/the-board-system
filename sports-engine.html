<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <meta name="description" content="Sports Engine — NFL parlay generation system.">
  <title>Sports Engine · The Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/board.css">
  <style>
    .engine-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .parlays-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .parlay-card {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 0.75rem;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.1);
    }

    .parlay-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2);
      border-color: #60a5fa;
    }

    .game-header {
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      padding: 1.5rem;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }

    .game-matchup {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
      color: #e2e8f0;
    }

    .game-time {
      font-size: 0.85rem;
      opacity: 0.9;
      color: #bfdbfe;
    }

    .game-script {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.25rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tickets {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .ticket {
      background: rgba(59, 130, 246, 0.05);
      border-left: 4px solid #3b82f6;
      padding: 1.25rem;
      border-radius: 0.25rem;
    }

    .ticket-type {
      font-weight: bold;
      color: #93c5fd;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .ticket-odds {
      font-size: 1.4rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 0.5rem;
    }

    .ticket-stats {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .ticket-stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ticket-stat-label {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .legs-preview {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }

    .legs-title {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .leg {
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .leg-market {
      background: rgba(59, 130, 246, 0.2);
      padding: 0.1rem 0.4rem;
      border-radius: 0.15rem;
      font-size: 0.65rem;
      color: #93c5fd;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .leg-player {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leg-line {
      color: #94a3b8;
      font-size: 0.65rem;
    }

    .expand-btn {
      margin-top: 0.75rem;
      padding: 0.5rem;
      width: 100%;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .expand-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: #60a5fa;
    }

    .legs-full {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
      display: none;
    }

    .legs-full.show {
      display: block;
    }

    .td-parlays-section {
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 2px solid #3b82f6;
    }

    .td-section-title {
      text-align: center;
      color: #3b82f6;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }

    .td-parlay-card {
      background: #1e293b;
      border: 2px solid #ef4444;
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .td-game-header {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      padding: 1.5rem;
    }

    .td-game-matchup {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .td-legs {
      padding: 1.5rem;
    }

    .td-leg {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border-radius: 0.25rem;
    }

    .td-leg-player {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fca5a5;
      margin-bottom: 0.25rem;
    }

    .td-leg-odds {
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .parlays-grid {
        grid-template-columns: 1fr;
      }

      .tickets {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#app">Skip to the engine</a>

  <nav class="site-switch" aria-label="Board network">
    <span class="site-switch-label">The Board Network</span>
    <a class="site-tab" href="https://wordups.github.io/the-board-system/">Sports Board</a>
    <a class="site-tab active" href="sports-engine.html" aria-current="page">Sports Engine</a>
    <a class="site-tab" href="https://wordups.github.io/the-board-market/">Stock Market</a>
  </nav>

  <header class="site-header">
    <a class="brand" href="sports-engine.html" aria-label="Sports Engine home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>SPORTS ENGINE</strong><small>PARLAY SYSTEM</small></span>
    </a>
    <div class="header-status">
      <span class="status-pulse" aria-hidden="true"></span>
      <span id="header-freshness" style="display: none;">Loading slate</span>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="engine-container">
      <div class="parlays-grid" id="parlays-container">
        <section class="loading-state" aria-live="polite">
          <div class="loading-orbit" aria-hidden="true"></div>
          <p>Loading parlay data…</p>
        </section>
      </div>

      <div class="td-parlays-section" id="td-section" style="display:none;">
        <h2 class="td-section-title">⭐ Star Player TD Parlays</h2>
        <div id="td-parlays-container">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <noscript>Sports Engine needs JavaScript to display parlay data.</noscript>
  <script src="assets/board.js"></script>
  <script>
    async function loadParlays() {
      try {
        const response = await fetch('data/nfl_parlays.json');
        const data = await response.json();

        const container = document.getElementById('parlays-container');
        container.innerHTML = '';

        data.parlays.forEach((parlay, index) => {
          const card = createParlayCard(parlay, index);
          container.appendChild(card);
        });

        renderTDParlays(data);
      } catch (error) {
        console.error('Error loading parlays:', error);
        document.getElementById('parlays-container').innerHTML =
          '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">Error loading parlay data</p>';
      }
    }

    function createParlayCard(parlay) {
      const card = document.createElement('div');
      card.className = 'parlay-card';

      const gameScriptLabel = {
        'shootout': '🔥 Shootout',
        'blowout': '🏈 Blowout',
        'normal': '⚖️ Normal'
      }[parlay.game_script] || 'Normal';

      let ticketsHtml = '';
      if (parlay.grind) {
        ticketsHtml += `
          <div class="ticket">
            <div class="ticket-type">Grind</div>
            <div class="ticket-odds">${parlay.grind.odds}</div>
            <div class="ticket-stats">
              <div class="ticket-stat-item">
                <div>${parlay.grind.stake}</div>
                <div class="ticket-stat-label">Stake</div>
              </div>
              <div class="ticket-stat-item">
                <div>${parlay.grind.implied_win}</div>
                <div class="ticket-stat-label">Win</div>
              </div>
            </div>
            <div class="legs-preview">
              <div class="legs-title">${parlay.grind.legs.length} Legs</div>
              ${parlay.grind.legs.slice(0, 2).map(leg => `
                <div class="leg">
                  <span class="leg-market">${leg.market}</span>
                  <span class="leg-player">${leg.player_name}</span>
                  <span class="leg-line">${leg.line}</span>
                </div>
              `).join('')}
            </div>
            <button class="expand-btn" onclick="toggleLegs(this)">View All ${parlay.grind.legs.length} Legs</button>
            <div class="legs-full">
              ${parlay.grind.legs.map(leg => `
                <div class="leg">
                  <span class="leg-market">${leg.market}</span>
                  <span class="leg-player">${leg.player_name}</span>
                  <span class="leg-line">${leg.line}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (parlay.moonshot) {
        ticketsHtml += `
          <div class="ticket">
            <div class="ticket-type">Moonshot</div>
            <div class="ticket-odds">${parlay.moonshot.odds}</div>
            <div class="ticket-stats">
              <div class="ticket-stat-item">
                <div>${parlay.moonshot.stake}</div>
                <div class="ticket-stat-label">Stake</div>
              </div>
              <div class="ticket-stat-item">
                <div>${parlay.moonshot.implied_win}</div>
                <div class="ticket-stat-label">Win</div>
              </div>
            </div>
            <div class="legs-preview">
              <div class="legs-title">${parlay.moonshot.legs.length} Legs</div>
              ${parlay.moonshot.legs.slice(0, 2).map(leg => `
                <div class="leg">
                  <span class="leg-market">${leg.market}</span>
                  <span class="leg-player">${leg.player_name}</span>
                  <span class="leg-line">${leg.line}</span>
                </div>
              `).join('')}
            </div>
            <button class="expand-btn" onclick="toggleLegs(this)">View All ${parlay.moonshot.legs.length} Legs</button>
            <div class="legs-full">
              ${parlay.moonshot.legs.map(leg => `
                <div class="leg">
                  <span class="leg-market">${leg.market}</span>
                  <span class="leg-player">${leg.player_name}</span>
                  <span class="leg-line">${leg.line}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="game-header">
          <div class="game-matchup">${parlay.matchup}</div>
          <div class="game-time">${parlay.time}</div>
          <div class="game-script">${gameScriptLabel}</div>
        </div>
        <div class="tickets">${ticketsHtml}</div>
      `;

      return card;
    }

    function toggleLegs(btn) {
      const parent = btn.parentElement;
      const legsFull = parent.querySelector('.legs-full');
      legsFull.classList.toggle('show');
      btn.textContent = legsFull.classList.contains('show') ? 'Hide Legs' : btn.textContent.replace('Hide', 'View All');
    }

    function renderTDParlays(data) {
      if (!data.td_parlays || data.td_parlays.length === 0) return;

      const tdSection = document.getElementById('td-section');
      const tdContainer = document.getElementById('td-parlays-container');
      tdSection.style.display = 'block';
      tdContainer.innerHTML = '';

      data.td_parlays.forEach(parlay => {
        const card = document.createElement('div');
        card.className = 'td-parlay-card';

        const legsHtml = parlay.td_parlay.legs.map(leg => `
          <div class="td-leg">
            <div class="td-leg-player">${leg.player_name}</div>
            <div class="td-leg-odds">
              <span>${leg.market}</span>
              <span>${leg.line}</span>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="td-game-header">
            <div class="td-game-matchup">${parlay.matchup}</div>
            <div style="font-size: 0.9rem; opacity: 0.9;">${parlay.time} · ${parlay.game_script}</div>
          </div>
          <div class="td-legs">
            <div style="font-weight: bold; margin-bottom: 1rem; color: #fca5a5;">
              Odds: ${parlay.td_parlay.odds} · ${parlay.td_parlay.legs.length} Star Players
            </div>
            ${legsHtml}
          </div>
        `;

        tdContainer.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadParlays);
  </script>
</body>
</html>
